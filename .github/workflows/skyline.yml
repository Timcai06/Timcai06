name: Contribution skyline

on:
  schedule:
    - cron: '17 19 * * *'  # 03:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/build_skyline.py
        env:
          # A fine-grained PAT (read-only) counts private contributions the same
          # way the profile does; the default token falls back to public data.
          GH_TOKEN: ${{ secrets.SKYLINE_TOKEN || github.token }}
      - name: Commit if changed
        run: |
          git diff --quiet assets/editor/skyline.svg && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/editor/skyline.svg
          git commit -m 'chore(profile): refresh contribution skyline'
          git push
